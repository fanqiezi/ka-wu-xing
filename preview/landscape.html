<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>卡五星 · 手机版样张（横屏 844×390）</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="preview.css">
</head>
<body class="preview landscape">

<div class="hint">
  <b>横屏样张 844×390</b>（假数据，不接逻辑）<br>
  布局等同电脑版：顶栏（四个方框 + 按钮）· 上家 | 中央 | 下家 · 你在下方 · 右侧对局记录。<br>
  右边缘竖条「样张设置」可切状态 / 手牌大小 / 牌河。
</div>

<div class="frame">
  <div class="phone">
    <div class="confirm-bar" id="confirmBar"></div>

    <div id="app">
      <!-- 顶栏：品牌 + 四个方框 + 按钮（与电脑版一致） -->
      <header class="topbar">
        <div class="brand">
          <span class="logo">中</span>
          <div><h1>卡五星麻将</h1><p class="sub">湖北三人麻将 · 单机版</p></div>
        </div>
        <div class="hud">
          <div class="hud-item"><label>局数</label><b id="hud-round">12</b></div>
          <div class="hud-item"><label>底金</label><b id="hud-base">5</b></div>
          <div class="hud-item"><label>剩余牌</label><b id="hud-wall">42</b></div>
          <div class="hud-item"><label>庄家</label><b id="hud-dealer">你</b></div>
        </div>
        <div class="topbtns">
          <button class="btn ghost" data-sheet="history">对局记录</button>
          <button class="btn ghost" data-sheet="settings">规则</button>
          <button class="btn ghost" data-sheet="settings">设置</button>
          <button class="btn ghost" data-act="menu">返回菜单</button>
          <button class="btn primary" data-act="newmatch">新对局</button>
        </div>
      </header>

      <!-- 牌桌：上家 | 中央 | 下家，然后是你 -->
      <main class="table" id="table">
        <div class="opponents">
          <section class="seat seat-opp" data-opp="top"></section>
          <div class="center-col">
            <div class="center-info">
              <div class="turn-indicator" id="turnIndicator">轮到你出牌</div>
              <div class="center-tiles" id="centerTiles"></div>
              <div class="center-meta" id="centerMeta"></div>
            </div>
          </div>
          <section class="seat seat-opp" data-opp="bottom"></section>
        </div>
        <section class="seat seat-self" data-opp="self"></section>
      </main>

      <!-- 右侧对局记录（横屏保留，和电脑版一致） -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span>对局记录</span>
          <button class="btn tiny ghost" data-act="clearlog">清空</button>
        </div>
        <div class="log" id="log"></div>
      </aside>

      <div class="actionbar" id="actionbar"></div>
    </div>

    <div class="demo">
      <button class="demo-toggle">样张设置</button>
      <div class="demo-body">
        <div class="demo-row"><span class="lab">状态</span>
          <button data-view="state:normal">正常</button>
          <button data-view="state:danger">上家亮倒</button>
          <button data-view="state:selfLd">我亮倒</button>
        </div>
        <div class="demo-row"><span class="lab">手牌</span>
          <button data-view="handSize:compact">紧凑</button>
          <button data-view="handSize:standard">标准</button>
          <button data-view="handSize:big">大字</button>
          <button data-view="handSize:twoRows">两行</button>
        </div>
        <div class="demo-row"><span class="lab">牌河</span>
          <button data-view="river:full">完整</button>
          <button data-view="river:short">精简</button>
        </div>
      </div>
    </div>

    <div class="infobar" id="infoBar"></div>
    <div class="toast" id="toast"></div>
    <div class="sheet-mask" id="sheetMask"></div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script src="../js/tiles.js"></script>
<script src="preview.js"></script>
<script>PREVIEW.render();</script>
</body>
</html>
